<body>
<title>CPD Visitor Check-In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500;100,700;125,800&family=Barlow:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a dark industrial kiosk (one screen, big tap targets) and a dense back-office console behind a PIN.
   Single committed dark look, matching the CPD brand image: charcoal steel, white, a green and a red accent. */
:root{
  --bg:#14212a; --bg-2:#1b2a34; --bg-3:#243540; --line:#334652; --line-2:#48606e; --teal:#1e3440;
  --fg:#f4f6f7; --fg-2:#b9c6ce; --fg-3:#7f909b;
  --green:#4cb848; --green-2:#3a9c38; --red:#e2493e; --amber:#e3a72f;
  --display:"Archivo","Arial Black",Helvetica,Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif;
  --script:"Caveat","Segoe Script","Bradley Hand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.display{font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:.14em;line-height:1.05}
.eyebrow{font-family:var(--display);font-stretch:100%;font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--fg-3)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg-3);border:1px solid var(--line-2);border-radius:6px;padding:.75rem .9rem;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,.tile:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input::placeholder{color:var(--fg-3)}
label.field{display:grid;gap:.35rem}
label.field>span{font-weight:600;font-size:.9rem;color:var(--fg-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--line-2);background:var(--bg-3);border-radius:8px;padding:.8rem 1.3rem;font-weight:600;letter-spacing:.02em;transition:background .15s,border-color .15s}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--green);border-color:var(--green);color:#0d1a0f}
.btn.primary:hover{background:var(--green-2)}
.btn.danger{border-color:var(--red);color:#ffb3ad}
.btn.danger:hover{background:rgba(226,74,63,.18)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--bg-3)}
.btn.big{padding:1.1rem 1.6rem;font-size:1.15rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:.4rem .7rem;font-size:.85rem;border-radius:6px}

/* logo */
.logo{display:block;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}

/* ---------- kiosk ---------- */

#kiosk::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(200deg,rgba(15,21,25,.15) 0%,rgba(15,21,25,.55) 45%,rgba(20,33,42,.92) 100%)}
#kiosk.deep::after{background:linear-gradient(180deg,rgba(15,21,25,.72),rgba(20,33,42,.94) 40%,#14212a 100%)}
#kiosk .welcome{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:1.5rem}
#kiosk .welcome h1.display{font-size:clamp(2.4rem,7vw,5rem);letter-spacing:.2em;font-weight:700;font-stretch:100%}
#kiosk .welcome .choice{margin-top:1.4rem}
#kiosk .step{background:rgba(20,33,42,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:clamp(1.2rem,3vw,2.2rem)}
#kiosk .done{background:rgba(20,33,42,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:clamp(1.2rem,3vw,2.2rem)}
.k-head{display:flex;justify-content:space-between;align-items:center;padding-block:1.25rem .5rem;gap:1rem}
.k-head .logo{height:72px}
.k-head .clock{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:.95rem;line-height:1.3}
.k-head .clock b{display:block;color:var(--fg);font-size:1.35rem;font-weight:600}
.k-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:980px;width:100%;margin:0 auto;padding-block:1rem 2rem}
.k-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:.75rem 1rem;color:var(--fg-3);font-size:.85rem}
.step{display:grid;gap:1.4rem}
.step h1.display{font-size:clamp(1.9rem,5vw,3.4rem)}

/* ---------- store: Supabase ---------- */
const CFG=window.CPD_CONFIG||{};
const SB=(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const Store=(()=>{
 const COLS=['staff','visits','notifications','settings'];
 const cache={};COLS.forEach(c=>cache[c]={});
 const subs=[];let ready=false,session=null,err='',loading=false;
 const emit=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
 const rows=(c,list)=>{const o={};(list||[]).forEach(r=>o[r.id]={...(r.data||{}),id:r.id});cache[c]=o};
 const chk=r=>{if(r.error)throw r.error;return r.data};
 async function load(){
  if(!SB){err='Not configured: edit config.js and add your Supabase URL and anon key.';ready=true;emit();return}
  if(loading)return;loading=true;
  try{
   if(session){
    const [st,vi,no,se]=await Promise.all([SB.from('staff').select('id,data'),SB.from('visits').select('id,data'),SB.from('notifications').select('id,data'),SB.from('settings').select('id,data')]);
    rows('staff',chk(st));rows('visits',chk(vi));rows('notifications',chk(no));rows('settings',chk(se));
   }else{
    const [st,os,se]=await Promise.all([SB.from('staff_public').select('*'),SB.from('on_site').select('*'),SB.from('settings').select('id,data')]);
    const so={};chk(st).forEach(r=>so[r.id]={id:r.id,name:r.name,title:r.title,department:r.department});cache.staff=so;
    const vo={};chk(os).forEach(r=>vo[r.id]={id:r.id,name:r.name,company:r.company,signedInAt:r.signed_in_at,signedOutAt:null});cache.visits=vo;
    cache.notifications={};rows('settings',chk(se));
   }
   err='';
  }catch(e){err=e.message||String(e);console.error('load',e)}
  loading=false;ready=true;emit();
 }
 async function init(){
  if(!SB){await load();return}
  try{const {data}=await SB.auth.getSession();session=data.session}catch(e){console.error(e)}
  SB.auth.onAuthStateChange((ev,s)=>{const was=!!session;session=s;if(ev==='SIGNED_IN'&&!was){if(location.hash!=='#admin')location.hash='#admin'}load()});
  await load();
  setInterval(load,20000);
  try{SB.channel('cpd-live').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe()}catch(e){console.warn('realtime',e)}
 }
 async function set(col,id,data){
  const prev=cache[col][id];cache[col]={...cache[col],[id]:{...data,id}};emit();
  const body={...data};delete body.id;
  const q=session?SB.from(col).upsert({id,data:body}):SB.from(col).insert({id,data:body});
  const {error}=await q;
  if(error){toast('Could not save: '+error.message);if(prev)cache[col][id]=prev;else delete cache[col][id];emit();throw error}
  if(!session)load();
 }
 async function del(col,id){
  const {error}=await SB.from(col).delete().eq('id',id);if(error){toast('Could not delete: '+error.message);throw error}
  const o={...cache[col]};delete o[id];cache[col]=o;emit();
 }
 async function clear(col){
  const {error}=await SB.from(col).delete().neq('id','');if(error){toast('Could not clear: '+error.message);throw error}
  cache[col]={};emit();
 }
 async function signOut(id){
  const {error}=await SB.rpc('sign_out',{vid:id});if(error){toast('Could not sign out: '+error.message);throw error}
  const v=cache.visits[id];if(v)cache.visits={...cache.visits,[id]:{...v,signedOutAt:new Date().toISOString()}};emit();load();
 }
 async function login(email){
  const redirect=location.origin+location.pathname+'#admin';
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:false}});
  if(error)throw error;
 }
 async function logout(){await SB.auth.signOut();session=null;location.hash='';load()}
 return{init,set,del,clear,signOut,login,logout,load,list:c=>Object.values(cache[c]),get:(c,id)=>cache[c][id],sub:f=>subs.push(f),
  get mode(){return 'db'},get ready(){return ready},get canWrite(){return true},get session(){return session},get err(){return err},get user(){return session&&session.user?session.user.email:''}};
})();

  subject:`Your visitor has arrived: ${v.name} (${v.company})`,

   ?`Hi ${first},\n\n${v.name} from ${v.company} (contractor) has checked in at reception at ${fmtT(v.signedInAt)} on ${fmtD(v.signedInAt)} and has named you as their CPD contact.\n\nWork: ${v.note}\n\nThey have completed the site safety briefing. Please come to reception to meet them and escort them to the work area.\n\nCPD Reception`

}

function initPad(c){
 const dpr=window.devicePixelRatio||1;const r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
 const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1b2129';
 let drawing=false,dirty=false,last=null;
 const pos=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
 c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y);ctx.stroke();dirty=true};
 c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{drawing=false};
 return{clear(){ctx.clearRect(0,0,c.width,c.height);dirty=false},dirty:()=>dirty,
  png(){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.fillStyle='#fbfbf9';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0);return o.toDataURL('image/png')}};
}

function renderAdmin(){
 if(!A.unlocked){
  admin(`<div class="pin"><div>${ICON.pin}<div class="eyebrow" style="margin-top:.5rem">Staff only</div><h2 class="display" style="font-size:1.6rem;margin-top:.4rem">Sign in to the back office</h2></div>

   :`<p class="muted" style="margin:0">Enter your CPD email address and we will send you a one-time sign-in link. No password needed.</p>
   <input id="email" type="email" placeholder="you@cpdbodies.com" value="${esc(A.email)}" autocomplete="email" style="text-align:left;font-size:1rem;letter-spacing:0">
   <div class="err">${esc(A.loginErr||'')}</div><button class="btn primary big" id="send">Email me a sign-in link</button>`}
   ${Store.err?`<div class="err">${esc(Store.err)}</div>`:''}</div>`);
  if(A.sent){$('#again').onclick=()=>{A.sent=false;render()};return}
  const em=$('#email');em.focus();
  const go2=async()=>{const e=em.value.trim().toLowerCase();if(!e.includes('@')){A.loginErr='Enter a valid email address.';render();return}
   const b=$('#send');b.disabled=true;b.textContent='Sending…';
   try{await Store.login(e);A.email=e;A.sent=true;A.loginErr=''}catch(x){A.loginErr=/signups not allowed|not allowed|not found/i.test(x.message)?'That email is not registered for back-office access. Ask an administrator to invite you in Supabase.':x.message}
   render()};
  $('#send').onclick=go2;em.onkeydown=e=>{if(e.key==='Enter')go2()};
  return;
 }
 if(A.tab==='visitors')return renderVisitors();
 if(A.tab==='master')return renderMaster();
 if(A.tab==='esg')return renderESG();
 if(A.tab==='staff')return renderStaff();

function renderVisitors(){
 const all=visits();const q=A.q.toLowerCase();
 let rows=all.filter(v=>A.filter==='onsite'?!v.signedOutAt:A.filter==='today'?isToday(v.signedInAt):true);
 if(q)rows=rows.filter(v=>[v.name,v.company,v.hostName,v.onBehalfOf,v.deliveringFrom,v.note,reasonOf(v.reason).label].join(' ').toLowerCase().includes(q));
 const detail=v=>v.reason==='meeting'?`Seeing ${esc(v.hostName)}`:v.reason==='interview'?`Interview with ${esc(v.hostName)}${v.note?`<span class="sub">${esc(v.note)}</span>`:''}`:v.reason==='farizon'?`Seeing ${esc(v.hostName)}${v.note?`<span class="sub">${esc(v.note)}</span>`:''}`:v.reason==='other'?`${esc(v.note)}<span class="sub">Seeing ${esc(v.hostName)}</span>`:v.reason==='doocey'?`Parcel for ${esc(v.hostName)}${v.courierNote?`<span class="sub">${esc(v.courierNote)}</span>`:''}`:v.reason==='contractor'?`${esc(v.note)}<span class="sub">Contact: ${esc(v.hostName)}</span>`:v.reason==='collect'?`On behalf of ${esc(v.onBehalfOf)}<span class="sub">${v.hasGateCode?'Gate code '+esc(v.gateCode):'No gate release code'}</span>`:v.reason==='deliver'?`From ${esc(v.deliveringFrom)}`:esc(v.note||'—');
 admin(`<div class="stats"><div class="stat">${ICON.building}<b>${onSite().length}</b><span>On site now</span></div><div class="stat">${ICON.clock}<b>${all.filter(v=>isToday(v.signedInAt)).length}</b><span>Visits today</span></div><div class="stat">${ICON.queue}<b>${Store.list('notifications').filter(n=>n.status==='queued').length}</b><span>Notifications queued</span></div><div class="stat">${ICON.users}<b>${staffList().length}</b><span>Staff on the list</span></div></div>
  <div class="toolbar"><div class="seg">${[['onsite','On site'],['today','Today'],['all','All']].map(([k,l])=>`<button class="${A.filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
   <input id="q" placeholder="Search visitors" value="${esc(A.q)}" autocomplete="off"><button class="btn" id="csv">${ICON.download} Export CSV</button></div>
  <div class="tablewrap"><table><thead><tr><th>In</th><th>Visitor</th><th>Reason</th><th>Detail</th><th>Out</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(v=>`<tr><td class="time">${esc(fmtT(v.signedInAt))}<span class="sub">${esc(fmtD(v.signedInAt))}</span></td><td><b>${esc(v.name)}</b><span class="sub">${esc(v.company)}</span></td><td>${esc(reasonOf(v.reason).label)}</td><td class="wrap">${detail(v)}</td><td class="time">${v.signedOutAt?esc(fmtT(v.signedOutAt))+`<span class="sub">${esc(fmtD(v.signedOutAt))}</span>`:'—'}</td><td><span class="pill ${v.signedOutAt?'off':'on'}">${v.signedOutAt?'Left':'On site'}</span></td>
   <td><div class="actions"><button class="btn sm" data-view="${v.id}">View</button>${v.signedOutAt?'':`<button class="btn sm" data-out="${v.id}">Sign out</button>`}<button class="btn sm danger" data-del="${v.id}">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">${all.length?'No visitors match this view.':'No visits recorded yet. Load the sample data in Settings, or check someone in at the front desk.'}</div></td></tr>`}
  </tbody></table></div>`);
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{A.filter=b.dataset.f;render()});
 const qi=$('#q');qi.oninput=e=>{A.q=e.target.value;render();const q2=$('#q');q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)};
 $('#csv').onclick=()=>exportCSV(rows,'cpd-visitors-'+A.filter);
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{A.modal={type:'visit',id:b.dataset.view};render()});
 document.querySelectorAll('[data-out]').forEach(b=>b.onclick=async()=>{const v=Store.get('visits',b.dataset.out);await Store.signOut(v.id);toast(v.name+' signed out')});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const v=Store.get('visits',b.dataset.del);A.modal={type:'confirm',title:'Delete this visit record?',text:`${v.name} (${v.company}) will be removed from the register permanently.`,ok:async()=>{await Store.del('visits',v.id);toast('Visit deleted')}};render()});
}
function dlFile(fn,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Downloading '+fn)}
const mins=v=>v.signedOutAt?Math.round((new Date(v.signedOutAt)-new Date(v.signedInAt))/60000):'';
async function exportCSV(rows,name){
 const H=['Record ID','Date','Signed in','Signed out','Time on site (mins)','Name','Company','Reason','On behalf of','Has gate release code','Gate release code','Delivering from','Host','Host email','Note','Safety briefing acknowledged','Signature','Signature type','Travelled from (area)','Travel mode','People travelling','Round-trip km','kg CO2e'];
 const cell=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const lines=[H.join(',')].concat(rows.map(v=>[v.id,fmtD(v.signedInAt),fmtDT(v.signedInAt),v.signedOutAt?fmtDT(v.signedOutAt):'',mins(v),v.name,v.company,reasonOf(v.reason).label,v.onBehalfOf,v.reason==='collect'?(v.hasGateCode?'Yes':'No'):'',v.hasGateCode?v.gateCode:'',v.deliveringFrom,v.hostName,v.hostEmail,v.note,(v.acknowledgements||[]).length===RULES.length?'Yes, all '+RULES.length+' points':(v.acknowledgements||[]).length+' of '+RULES.length,v.signatureType==='drawn'?'Drawn signature on file':(v.signatureText||''),v.signatureType||'',v.travel?v.travel.area:'',v.travel?v.travel.mode:'',v.travel?v.travel.people:'',v.travel?v.travel.roundKm:'',v.travel?v.travel.kgCO2e:''].map(cell).join(',')));
 const csv=lines.join('\n');const fn=(name||'cpd-visitors')+'-'+new Date().toISOString().slice(0,10)+'.csv';
 dlFile(fn,csv);
}

 admin(`<div class="panel"><h3>Master visitor record</h3><p class="muted" style="margin:0">Every check-in ever recorded, with every detail captured, kept permanently until deleted. <b>${all.length}</b> records in total. Download includes all columns below plus the record ID; drawn signatures are viewable per record via <b>View</b> on the Visitors tab.</p>
  <div class="toolbar"><input id="mq" placeholder="Search all records" value="${esc(A.mq||'')}" autocomplete="off"><button class="btn primary" id="dl">${ICON.download} Download master list (CSV)</button></div></div>
  <div class="tablewrap" style="max-height:70vh;overflow:auto"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Mins</th><th>Name</th><th>Company</th><th>Reason</th><th>On behalf of</th><th>Gate code</th><th>Delivering from</th><th>Host</th><th>Host email</th><th>Note</th><th>From</th><th>Mode</th><th>km</th><th>kg CO₂e</th><th>Briefing</th><th>Signature</th></tr></thead><tbody>
  ${rows.length?rows.map(v=>`<tr><td class="time">${esc(fmtD(v.signedInAt))}</td><td class="time">${esc(fmtT(v.signedInAt))}</td><td class="time">${v.signedOutAt?esc(fmtT(v.signedOutAt)):'<span class="pill on">On site</span>'}</td><td class="time">${mins(v)}</td><td><b>${esc(v.name)}</b></td><td>${esc(v.company)}</td><td>${esc(reasonOf(v.reason).label)}</td><td>${esc(v.onBehalfOf||'')}</td><td>${v.reason==='collect'?(v.hasGateCode?esc(v.gateCode):'None'):''}</td><td>${esc(v.deliveringFrom||'')}</td><td>${esc(v.hostName||'')}</td><td>${esc(v.hostEmail||'')}</td><td class="wrap">${esc(v.note||'')}</td><td>${esc(v.travel?v.travel.area:'')}</td><td>${esc(v.travel?v.travel.mode:'')}</td><td class="time">${v.travel?v.travel.roundKm:''}</td><td class="time">${v.travel?v.travel.kgCO2e:''}</td><td>${(v.acknowledgements||[]).length}/${RULES.length}</td><td>${v.signatureType==='drawn'?'Drawn':esc(v.signatureText||'')}</td></tr>`).join(''):'<tr><td colspan="19"><div class="empty">No records yet.</div></td></tr>'}
  </tbody></table></div>`);
 const mq=$('#mq');mq.oninput=e=>{A.mq=e.target.value;render();const m2=$('#mq');m2.focus();m2.setSelectionRange(m2.value.length,m2.value.length)};
 $('#dl').onclick=()=>exportCSV(all,'cpd-visitor-master-list');
}
function renderESG(){
 const all=visits().filter(v=>v.travel);
 const month=all.filter(v=>{const d=new Date(v.signedInAt),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});
 const sum=(arr,f)=>arr.reduce((t,v)=>t+(f(v)||0),0);
 const kg=sum(all,v=>v.travel.kgCO2e),km=sum(all,v=>v.travel.roundKm),mkg=sum(month,v=>v.travel.kgCO2e);
 const byMode={};all.forEach(v=>{const m=v.travel.mode;byMode[m]=byMode[m]||{n:0,kg:0,km:0};byMode[m].n++;byMode[m].kg+=v.travel.kgCO2e;byMode[m].km+=v.travel.roundKm});
 const byArea={};all.forEach(v=>{const a=v.travel.area;byArea[a]=byArea[a]||{n:0,kg:0};byArea[a].n++;byArea[a].kg+=v.travel.kgCO2e});
 const areas=Object.entries(byArea).sort((a,b)=>b[1].kg-a[1].kg).slice(0,10);
 const maxKg=Math.max(1,...Object.values(byMode).map(x=>x.kg));
 const r1=x=>Math.round(x*10)/10;
 admin(`<div class="stats"><div class="stat">${ICON.leaf}<b>${r1(kg)}</b><span>kg CO₂e, all visits</span></div><div class="stat">${ICON.clock}<b>${r1(mkg)}</b><span>kg CO₂e this month</span></div><div class="stat">${ICON.truckOut}<b>${km.toLocaleString()}</b><span>visitor km travelled (round trip)</span></div><div class="stat">${ICON.users}<b>${all.length?r1(kg/all.length):0}</b><span>kg CO₂e per visitor</span></div></div>
  <div class="two"><div class="panel"><h3>By travel mode</h3>${Object.keys(byMode).length?Object.entries(byMode).sort((a,b)=>b[1].kg-a[1].kg).map(([m,x])=>`<div class="bar"><div class="meta"><span>${esc(m)} <span class="muted">· ${x.n} visit${x.n===1?'':'s'} · ${x.km} km</span></span><b>${r1(x.kg)} kg</b></div><i style="width:${Math.round(x.kg/maxKg*100)}%"></i></div>`).join(''):'<div class="empty">No journey data yet. It is captured when visitors check in.</div>'}</div>
  <div class="panel"><h3>Top origin postcode areas</h3>${areas.length?`<div class="tablewrap"><table><thead><tr><th>Area</th><th>Visits</th><th>kg CO₂e</th></tr></thead><tbody>${areas.map(([a,x])=>`<tr><td><b>${esc(a)}</b></td><td class="time">${x.n}</td><td class="time">${r1(x.kg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No journey data yet.</div>'}</div></div>
  <div class="panel"><h3>How this is calculated</h3><p class="muted" style="margin:0">Distance is measured from the visitor's postcode area centroid to CPD, ${SITE.postcode} (straight line × 1.25 to approximate road distance), doubled for the round trip. Emission factors per km follow UK Government GHG conversion factors for business travel: average car 0.17 kg, hybrid 0.12, electric 0.05, van 0.24, taxi 0.21, bus/coach 0.08, rail 0.035, walking/cycling 0. Car, van and taxi figures are divided between the people travelling together. These are estimates for reporting trends, not audited figures. Equivalent to roughly <b>${Math.round(kg/21)} tree-years</b> of carbon absorption (at ~21 kg per tree per year).</p>
   <div class="inline"><button class="btn primary" id="dlEsg">${ICON.download} Download journey data (CSV)</button></div></div>`);
 $('#dlEsg').onclick=async()=>{const H=['Date','Visitor','Company','Host','Postcode area','People travelling','Mode','One-way km','Round-trip km','kg CO2e'];const cell=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const csv=[H.join(',')].concat(all.map(v=>[fmtDT(v.signedInAt),v.name,v.company,v.hostName,v.travel.area,v.travel.people,v.travel.mode,v.travel.oneWayKm,v.travel.roundKm,v.travel.kgCO2e].map(cell).join(','))).join('\n');
  const fn='cpd-visitor-esg-'+new Date().toISOString().slice(0,10)+'.csv';
  dlFile(fn,csv)};
}
function renderStaff(){
 const list=staffList();
 admin(`<div class="two"><div class="panel"><h3>Upload a staff list</h3><p class="muted" style="margin:0">CSV with the columns <b>Name</b> (or Display name), <b>Job Title</b>, <b>Department</b> (optional), <b>Email</b> in any order, header row required. Save your Excel staff report as CSV first. Existing people are matched by email address and updated.</p>
   <div class="dropzone" id="drop">Drop a .csv file here, or <label style="color:var(--green);cursor:pointer;text-decoration:underline">choose a file<input type="file" id="file" accept=".csv,text/csv,.txt" hidden></label></div>
   <label class="field"><span>Or paste rows (Name, Job Title, Department, Email)</span><textarea id="paste" rows="4" placeholder="Jane Smith, Sales Executive, Sales, jane.smith@cpdbodies.com"></textarea></label>
   <div class="inline"><button class="btn" id="preview">Preview import</button>${A.importRows?`<span>${A.importRows.length} people ready</span><button class="btn primary" id="doImport">Import ${A.importRows.length}</button><button class="btn ghost" id="cancelImport">Cancel</button>`:''}</div>
   ${A.importRows?`<div class="tablewrap" style="max-height:220px;overflow:auto"><table><thead><tr><th>Name</th><th>Job title</th><th>Department</th><th>Email</th></tr></thead><tbody>${A.importRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.title)}</td><td>${esc(r.department)}</td><td>${esc(r.email)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div>
  <div class="panel"><h3>Add one person</h3><label class="field"><span>Name</span><input id="nName" autocomplete="off"></label><label class="field"><span>Job title</span><input id="nTitle" autocomplete="off"></label><label class="field"><span>Department</span><input id="nDept" autocomplete="off"></label><label class="field"><span>Email address</span><input id="nEmail" type="email" autocomplete="off"></label><div><button class="btn primary" id="add">Add to staff list</button></div></div></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Job title</th><th>Department</th><th>Email</th><th></th></tr></thead><tbody>${list.length?list.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.title)}</td><td>${esc(s.department||'')}</td><td>${esc(s.email)}</td><td><div class="actions"><button class="btn sm" data-edit="${s.id}">Edit</button><button class="btn sm danger" data-del="${s.id}">Remove</button></div></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No staff on the list yet. Upload a CSV or add people individually.</div></td></tr>'}</tbody></table></div>`);
 const parseRows=text=>{
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return[];
  const split=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if((ch===','||ch==='\t')&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const first=split(lines[0]).map(s=>s.toLowerCase());
  const hasHeader=first.some(h=>/name|title|role|email/.test(h))&&!first.some(h=>h.includes('@'));
  let ni=0,ti=1,di=-1,ei=-1,fi=-1,li=-1;
  if(hasHeader){ni=first.findIndex(h=>/display name|full name|^name$/.test(h));fi=first.findIndex(h=>/first/.test(h));li=first.findIndex(h=>/last|surname/.test(h));if(ni<0)ni=first.findIndex(h=>/name/.test(h)&&!/email|first|last/.test(h));ti=first.findIndex(h=>/title|role|position/.test(h));di=first.findIndex(h=>/department|dept|team/.test(h));ei=first.findIndex(h=>/email|e-mail/.test(h))}
  const body=hasHeader?lines.slice(1):lines;
  const clean=x=>String(x||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
  return body.map(split).map(c=>{
   let email=ei>=0?c[ei]:(c.find(x=>x.includes('@'))||'');
   let name=ni>=0?c[ni]:'';if(!name&&fi>=0)name=(c[fi]||'')+' '+(li>=0?c[li]||'':'');
   const dept=di>=0?c[di]:(c.length>=4&&ei!==2?c[2]:'');
   return{name:clean(name),title:clean(ti>=0?c[ti]:''),department:clean(dept),email:clean(email).toLowerCase()}}).filter(r=>r.name&&r.email&&r.email.includes('@'));
 };
 const readFile=f=>{const rd=new FileReader();rd.onload=()=>{const rows=parseRows(rd.result);if(!rows.length){toast('No valid rows found in that file');return}A.importRows=rows;render()};rd.readAsText(f)};
 $('#file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0])};
 const dz=$('#drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])};
 $('#preview').onclick=()=>{const rows=parseRows($('#paste').value);if(!rows.length){toast('Paste at least one row with a name and an email address');return}A.importRows=rows;render()};
 if(A.importRows){
  $('#doImport').onclick=async()=>{const rows=A.importRows;A.importRows=null;const existing=staffList();let n=0;
   for(const r of rows){const ex=existing.find(s=>s.email===r.email);const id=ex?ex.id:'s'+uid();await Store.set('staff',id,{id,name:r.name,title:r.title,department:r.department,email:r.email});n++}
   toast(n+' people imported')};
  $('#cancelImport').onclick=()=>{A.importRows=null;render()};
 }
 $('#add').onclick=async()=>{const name=$('#nName').value.trim(),title=$('#nTitle').value.trim(),department=$('#nDept').value.trim(),email=$('#nEmail').value.trim().toLowerCase();if(!name||!email.includes('@')){toast('A name and a valid email address are required');return}
  const ex=staffList().find(s=>s.email===email);const id=ex?ex.id:'s'+uid();await Store.set('staff',id,{id,name,title,department,email});toast(ex?name+' updated':name+' added')};
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{A.modal={type:'staff',id:b.dataset.edit};render()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=Store.get('staff',b.dataset.del);A.modal={type:'confirm',title:'Remove '+s.name+'?',text:'They will no longer appear in the list visitors choose from. Past visit records are unaffected.',ok:async()=>{await Store.del('staff',s.id);toast(s.name+' removed')}};render()});
}
function renderNotes(){
 const list=Store.list('notifications').map(n=>{const v=Store.get('visits',n.visitId);if(!v)return null;const m=composeEmail(v);return{...n,...m,to:n.to||m.to,toName:n.toName||m.toName}}).filter(Boolean).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 admin(`<div class="panel"><h3>How arrival notifications work</h3><p class="muted" style="margin:0">When a visitor checks in for a meeting, an email to the member of staff they are visiting is composed here and queued. Emails are sent automatically if the optional email function is set up (see README); otherwise use <b>Open in email app</b> to send from the front desk mailbox. Mark each one as sent once it has gone.</p></div>
  <div class="notes">${list.length?list.map(n=>`<div class="note"><div class="meta"><span><b>To:</b> ${esc(n.toName)} &lt;${esc(n.to)}&gt;</span><span class="time">${esc(fmtDT(n.createdAt))} · <span class="pill ${n.status==='sent'?'sent':'q'}">${n.status}</span></span></div>
   <div><b>${esc(n.subject)}</b></div><pre>${esc(n.body)}</pre>
   <div class="actions"><a class="btn sm" href="mailto:${encodeURIComponent(n.to)}?subject=${encodeURIComponent(n.subject)}&body=${encodeURIComponent(n.body)}">Open in email app</a><button class="btn sm" data-copy="${n.id}">Copy email</button>${n.status==='sent'?'':`<button class="btn sm primary" data-sent="${n.id}">Mark as sent</button>`}<button class="btn sm danger" data-del="${n.id}">Delete</button></div></div>`).join(''):'<div class="empty">No notifications yet. They appear here when a visitor checks in for a meeting.</div>'}</div>`);
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const n=Store.get('notifications',b.dataset.copy);const t=`To: ${n.to}\nSubject: ${n.subject}\n\n${n.body}`;try{await navigator.clipboard.writeText(t);toast('Email copied')}catch{A.modal={type:'text',title:'Email',text:t};render()}});
 document.querySelectorAll('[data-sent]').forEach(b=>b.onclick=async()=>{const n=Store.get('notifications',b.dataset.sent);await Store.set('notifications',n.id,{...n,status:'sent',sentAt:new Date().toISOString()});toast('Marked as sent')});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await Store.del('notifications',b.dataset.del)});
}
function renderSettings(){
 const s=settings();
 admin(`<div class="two"><div class="panel"><h3>Site</h3><label class="field"><span>Site / company name shown to visitors</span><input id="sName" value="${esc(s.siteName)}"></label><label class="field"><span>Reception email</span><input id="sRec" value="${esc(s.reception)}"></label>
   <div><button class="btn primary" id="save">Save settings</button></div><p class="muted" style="margin:0">Back-office users are managed in Supabase (Authentication → Users → Invite user).</p></div>
  <div class="panel"><h3>Data</h3><p class="muted" style="margin:0">Register storage: <b>Supabase shared database</b>. Every device opening this link sees the same register.</p>
   <div class="inline"><button class="btn danger" id="clearV">Clear visitor log</button><span class="muted">Removes all visits and notifications, keeps the staff list.</span></div>
   <div class="inline"><button class="btn danger" id="clearAll">Clear everything</button><span class="muted">Empties the register completely.</span></div></div></div>`);
 $('#save').onclick=async()=>{await Store.set('settings','site',{...s,siteName:$('#sName').value.trim()||'CPD Group',reception:$('#sRec').value.trim()});toast('Settings saved')};
 $('#clearV').onclick=()=>{A.modal={type:'confirm',title:'Clear the visitor log?',text:'All visit records and notifications will be deleted. The staff list is kept.',ok:async()=>{await Store.clear('visits');await Store.clear('notifications');toast('Visitor log cleared')}};render()};
 $('#clearAll').onclick=()=>{A.modal={type:'confirm',title:'Clear everything?',text:'Staff list, visits and notifications will all be deleted.',ok:async()=>{await Store.clear('visits');await Store.clear('notifications');await Store.clear('staff');toast('Register emptied')}};render()};
}
function modalHTML(){
 const m=A.modal;
 if(m.type==='confirm')return`<div class="modal" id="modal"><div class="box"><h2>${esc(m.title)}</h2><p style="margin:0;color:var(--fg-2)">${esc(m.text)}</p><div class="actions" style="justify-content:flex-end"><button class="btn" id="mCancel">Cancel</button><button class="btn danger" id="mOk">Confirm</button></div></div></div>`;
 if(m.type==='text')return`<div class="modal" id="modal"><div class="box"><h2>${esc(m.title)}</h2><textarea rows="12" readonly>${esc(m.text)}</textarea><div class="actions" style="justify-content:flex-end"><button class="btn" id="mCancel">Close</button></div></div></div>`;
 if(m.type==='staff'){const s=Store.get('staff',m.id)||{};return`<div class="modal" id="modal"><div class="box"><h2>Edit staff member</h2><label class="field"><span>Name</span><input id="eName" value="${esc(s.name)}"></label><label class="field"><span>Job title</span><input id="eTitle" value="${esc(s.title)}"></label><label class="field"><span>Department</span><input id="eDept" value="${esc(s.department||'')}"></label><label class="field"><span>Email</span><input id="eEmail" value="${esc(s.email)}"></label><div class="actions" style="justify-content:flex-end"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">Save</button></div></div></div>`}
 if(m.type==='visit'){const v=Store.get('visits',m.id);if(!v)return'';
  return`<div class="modal" id="modal"><div class="box"><h2>${esc(v.name)} · ${esc(v.company)}</h2>
   <div class="kv"><span>Checked in</span><b class="time">${esc(fmtDT(v.signedInAt))}</b><span>Signed out</span><b class="time">${v.signedOutAt?esc(fmtDT(v.signedOutAt)):'Still on site'}</b><span>Reason</span><b>${esc(reasonOf(v.reason).label)}</b>
   ${v.reason==='interview'?`<span>Interviewer</span><b>${esc(v.hostName)}<span class="sub">${esc(v.hostEmail)}</span></b>`:''}
   ${v.reason==='other'||v.reason==='farizon'?`<span>Here to see</span><b>${esc(v.hostName)}<span class="sub">${esc(v.hostEmail)}</span></b>`:''}
   ${v.reason==='meeting'?`<span>Here to see</span><b>${esc(v.hostName)}<span class="sub">${esc(v.hostEmail)}</span></b>`:''}
   ${v.reason==='contractor'?`<span>CPD contact</span><b>${esc(v.hostName)}<span class="sub">${esc(v.hostEmail)}</span></b>`:''}
   ${v.reason==='doocey'?`<span>Parcel for</span><b>${esc(v.hostName)}<span class="sub">${esc(v.hostEmail)}</span></b>`:''}
   ${v.reason==='collect'?`<span>On behalf of</span><b>${esc(v.onBehalfOf)}</b><span>Gate release code</span><b>${v.hasGateCode?esc(v.gateCode):'None provided'}</b>`:''}
   ${v.reason==='deliver'?`<span>Delivering from</span><b>${esc(v.deliveringFrom)}</b>`:''}
   ${v.note?`<span>Notes</span><b>${esc(v.note)}</b>`:''}
   ${v.travel?`<span>Journey</span><b>${esc(v.travel.area)} area · ${esc(v.travel.mode)}${v.travel.people>1?' · '+v.travel.people+' travelling':''}<span class="sub">${v.travel.roundKm} km round trip · ${v.travel.kgCO2e} kg CO₂e</span></b>`:''}
   <span>Safety briefing</span><b>${(v.acknowledgements||[]).length} of ${RULES.length} points acknowledged</b></div>
   <div><div class="eyebrow" style="margin-bottom:.4rem">Signature (${esc(v.signatureType||'typed')})</div>${v.signatureData?`<div class="sigimg"><img src="${v.signatureData}" alt="Visitor signature"></div>`:`<div class="typed" style="font-size:2rem;min-height:80px;max-width:420px">${esc(v.signatureText||v.name)}</div>`}</div>
   <div class="actions" style="justify-content:flex-end"><button class="btn" id="mCancel">Close</button></div></div></div>`}
 return'';
}
function bindModal(){
 const m=A.modal;const close=()=>{A.modal=null;render()};
 const c=$('#mCancel');if(c)c.onclick=close;
 const box=$('#modal');if(box)box.onclick=e=>{if(e.target===box)close()};
 const ok=$('#mOk');
 if(ok&&m.type==='confirm')ok.onclick=async()=>{ok.disabled=true;try{await m.ok()}finally{A.modal=null;render()}};
 if(ok&&m.type==='staff')ok.onclick=async()=>{const s=Store.get('staff',m.id);const email=$('#eEmail').value.trim().toLowerCase();if(!$('#eName').value.trim()||!email.includes('@')){toast('A name and a valid email address are required');return}await Store.set('staff',s.id,{...s,name:$('#eName').value.trim(),title:$('#eTitle').value.trim(),department:$('#eDept').value.trim(),email});A.modal=null;render();toast('Saved')};
}

render();
Store.init();
})();
</script>
